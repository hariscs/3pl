# Render Blueprint for 3plwork (Postgres + Fastify API + Next.js web).
# Create via Render dashboard → New → Blueprint, pointed at this repo.
#
# One manual step after the first deploy (see NEXT_PUBLIC_API_URL below and
# the seed note at the bottom).

databases:
  - name: 3plwork-db
    plan: free
    databaseName: 3plwork
    user: 3plwork

services:
  # ---------------------------------------------------------------------------
  # API — Fastify + Prisma. Runs pending migrations on every boot (idempotent),
  # then starts the server. Does NOT seed (seeding is destructive — see below).
  # ---------------------------------------------------------------------------
  - type: web
    name: 3plwork-api
    runtime: node
    plan: free
    rootDir: api
    healthCheckPath: /health
    buildCommand: pnpm install && pnpm build:ts
    startCommand: pnpm exec prisma migrate deploy && pnpm exec fastify start -l info -a 0.0.0.0 dist/app.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: 3plwork-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Render generates a strong secret
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: HOST
        value: 0.0.0.0
      # PORT is injected by Render automatically.

  # ---------------------------------------------------------------------------
  # Web — Next.js dashboard. NEXT_PUBLIC_API_URL is baked in at build time, so
  # it must be set to the API's PUBLIC url before/at the web build.
  # ---------------------------------------------------------------------------
  - type: web
    name: 3plwork-web
    runtime: node
    plan: free
    rootDir: web
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Set this to the API's public URL (e.g. https://3plwork-api.onrender.com)
      # after the API service is created, then trigger a redeploy of this service.
      # sync:false = you fill it in via the dashboard; it is not auto-synced.
      - key: NEXT_PUBLIC_API_URL
        sync: false
